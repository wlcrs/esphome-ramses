substitutions:
  name: "esphome-ramses"
  friendly_name: "ESPHome RAMSES Gateway"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-c6-devkitc-1
  framework:
    type: esp-idf

external_components:
  - source: components
    components: [ ramses_esp ]

# Enable Home Assistant API & Web Server / Logging / OTA
api:

ota:
  - platform: esphome

logger:
  level: DEBUG

wifi:
  ssid: "MyWiFiNetwork"
  password: "MyWiFiPassword"
  ap:
    ssid: "ESPHome-RAMSES-AP"
    password: "fallbackpassword"

captive_portal:

# ==============================================================================
# Optional LED Configuration (RF Activity & Status Indication)
# ==============================================================================
# What it does:
#   Provides visual feedback by flashing the LED whenever a RAMSES II RF frame
#   is received or transmitted (matching the behavior of the original ramses_esp).
#
# Why it is optional:
#   - Different ESP32 / ESP32-C6 hardware boards route LEDs to different pins.
#   - For example, the Elecram / IMMRMKW ESP32-C6 board routes the RX/TX LED to GPIO19.
#   - Standard Espressif ESP32-C6 DevKit boards use GPIO8 for an on-board WS2812 RGB LED.
#   - If your hardware does not have an LED or uses GPIO19 for another purpose,
#     you can safely comment out or delete this section.
# ==============================================================================
output:
  - platform: gpio
    pin: GPIO19
    id: led_output

light:
  - platform: binary
    name: "Activity LED"
    output: led_output
    id: activity_led
    restore_mode: ALWAYS_OFF

# Fast 40ms pulse script triggered on RF packet events
script:
  - id: pulse_activity_led
    mode: restart
    then:
      - light.turn_on: activity_led
      - delay: 40ms
      - light.turn_off: activity_led

# RAMSES II Transceiver & HGI80 TCP Gateway
ramses_esp:
  id: ramses_hub
  cs_pin: GPIO18
  sck_pin: GPIO6
  mosi_pin: GPIO7
  miso_pin: GPIO2
  gdo0_pin: GPIO15 # Demodulated UART RX from CC1101 GDO0
  gdo2_pin: GPIO14 # CC1101 GDO2 (optional)
  uart_num: 1      # ESP32 hardware UART peripheral (default: 1)
  port: 6638       # TCP port for Home Assistant ramses_rf / ramses_cc (socket://<ip>:6638)
  on_message:
    - lambda: |-
        ESP_LOGD("ramses", "HGI80: %s", x.c_str());
    # Optional: Flash the activity LED on incoming RAMSES frame
    - script.execute: pulse_activity_led

