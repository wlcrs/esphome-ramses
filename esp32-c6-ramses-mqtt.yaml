# ==============================================================================
# Target Hardware: Elecram ESP32-C6 WiFi/Zigbee to 855–925 MHz Wireless Interface Board (MQTT Mode)
# Product Page: https://elecram.com/products/esp32-c6-wifi-zigbee-to-855-925mhz-wireless
# Repository: https://github.com/Elecram/ramses_esp
# Pinout: CS=GPIO18, SCK=GPIO6, MOSI=GPIO7, MISO=GPIO2, GDO0=GPIO15, GDO2=GPIO14, LED=GPIO19
# ==============================================================================


substitutions:
  name: "esphome-ramses-mqtt"
  friendly_name: "ESPHome RAMSES MQTT Gateway"
  ramses_device_id: "18_000001"
  mqtt_root: "ramses_esp"
  mqtt_broker: "192.168.1.50"
  mqtt_user: "mqtt_user"
  mqtt_password: "mqtt_password"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-c6-devkitc-1
  variant: esp32c6
  framework:
    type: esp-idf

external_components:
  - source: components
    components: [ ramses_esp ]

# Logging and OTA
logger:
  level: DEBUG

ota:
  - platform: esphome
  - platform: web_server

# Enable Improv Wi-Fi over Web Serial (for web.esphome.io)
improv_serial:

# Enable Wi-Fi & Web Server to access the Discovery Dashboard in browser at http://<esp-ip>/ramses
wifi:
  ap:
    ssid: "ESPHome-RAMSES-AP"

captive_portal:

# Time synchronization for RAMSES packet timestamps
time:
  - platform: sntp
    id: sntp_time

# Activity LED on GPIO19 (Flashes on RF packet RX/TX)
output:
  - platform: gpio
    pin: GPIO19
    id: led_output

light:
  - platform: binary
    name: "Activity LED"
    output: led_output
    id: activity_led
    restore_mode: ALWAYS_OFF

script:
  - id: pulse_activity_led
    mode: restart
    then:
      - light.turn_on: activity_led
      - delay: 40ms
      - light.turn_off: activity_led

# MQTT Client configured for 1-to-1 parity with ramses-mqtt / ramses_esp
mqtt:
  id: mqtt_client
  broker: ${mqtt_broker}
  username: ${mqtt_user}
  password: ${mqtt_password}

  # 1. Availability Status
  birth_message:
    topic: ${mqtt_root}/${ramses_device_id}
    payload: "online"
    qos: 1
    retain: true
  will_message:
    topic: ${mqtt_root}/${ramses_device_id}
    payload: "offline"
    qos: 1
    retain: true

  # 2. Publish firmware & version information upon connecting
  on_connect:
    - mqtt.publish:
        topic: ${mqtt_root}/${ramses_device_id}/info/firmware
        payload: "esphome-ramses"
        retain: true
    - mqtt.publish:
        topic: ${mqtt_root}/${ramses_device_id}/info/version
        payload: "0.1.0"
        retain: true

  # 3. Subscribed Channels (Packet TX and Gateway Commands)
  on_message:
    # Handle Outbound RAMSES Packets from Home Assistant / MQTT
    - topic: ${mqtt_root}/${ramses_device_id}/tx
      then:
        - lambda: |-
            auto doc = json::parse_json(x);
            if (doc["msg"].is<const char *>()) {
              std::string msg = doc["msg"].as<std::string>();
              ESP_LOGI("ramses_mqtt", "MQTT TX Request: %s", msg.c_str());
              id(ramses_hub).send_hgi80_command(msg);
            }
        - script.execute: pulse_activity_led

    # Handle evofw3 / ramses_rf handshake commands (e.g. "!V")
    - topic: ${mqtt_root}/${ramses_device_id}/cmd/cmd
      then:
        - lambda: |-
            if (x == "!V") {
              // Return evofw3 version response expected by ramses_rf
              id(mqtt_client).publish(
                "${mqtt_root}/${ramses_device_id}/cmd/result",
                "{\"cmd\":\"!V\",\"err\":\"ESP_OK\",\"return\":\"# evofw3 0.1.0\"}"
              );
            } else {
              id(mqtt_client).publish(
                "${mqtt_root}/${ramses_device_id}/cmd/result",
                "{\"cmd\":\"" + x + "\",\"err\":\"ESP_OK\",\"return\":0}"
              );
            }

# RAMSES II Transceiver & Gateway (Elecram ESP32-C6 Pinout)
ramses_esp:
  id: ramses_hub
  cs_pin: GPIO18
  sck_pin: GPIO6
  mosi_pin: GPIO7
  miso_pin: GPIO2
  gdo0_pin: GPIO15 # CC1101 GDO0 (TX)
  gdo2_pin: GPIO14 # CC1101 GDO2 (Demodulated RX Data)
  uart_num: 1
  port: 6638       # Concurrent TCP Socket server is also active

  # 4. Forward received RAMSES packets to MQTT /rx topic with timestamp
  on_message:
    - lambda: |-
        char ts_buf[32];
        auto now = id(sntp_time).now();
        if (now.is_valid()) {
          now.strftime(ts_buf, sizeof(ts_buf), "%Y-%m-%dT%H:%M:%S%z");
        } else {
          snprintf(ts_buf, sizeof(ts_buf), "1970-01-01T00:00:00Z");
        }

        std::string rendered = json::build_json([&](JsonObject root) {
          root["msg"] = x;
          root["ts"] = ts_buf;
        });

        id(mqtt_client).publish("${mqtt_root}/${ramses_device_id}/rx", rendered);
    - script.execute: pulse_activity_led

