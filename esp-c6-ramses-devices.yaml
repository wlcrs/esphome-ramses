substitutions:
  name: "esphome-ramses"

esphome:
  name: "${name}"
  devices:
    - id: ramses_32_137527
      name: "Ventilation Unit 32:137527"

esp32:
  board: esp32-c6-devkitc-1
  variant: esp32c6
  framework:
    type: esp-idf

external_components:
  - source: components
    components: [ ramses_esp, ramses_devices ]

logger:
  level: DEBUG

# 1. Enables Over-The-Air firmware updates from the ESPHome dashboard
ota:
  - platform: esphome

mdns:

api:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "ESPHome-RAMSES-AP"
    password: !secret wifi_ap_password

web_server:
  port: 80

# Activity LED on GPIO19 (Flashes on RF packet RX/TX)
output:
  - platform: gpio
    pin: GPIO19
    id: led_output

light:
  - platform: binary
    name: "Activity LED"
    output: led_output
    id: activity_led
    restore_mode: ALWAYS_OFF
    internal: true


script:
  - id: pulse_activity_led
    mode: restart
    then:
      - light.turn_on: activity_led
      - delay: 40ms
      - light.turn_off: activity_led

ramses_esp:
  id: ramses_hub
  sck_pin: GPIO6
  miso_pin: GPIO2
  mosi_pin: GPIO7
  cs_pin: GPIO18
  gdo0_pin: GPIO15 # CC1101 GDO0 (TX)
  gdo2_pin: GPIO14 # CC1101 GDO2 (Demodulated RX Data)
  port: 6638
  on_message:
      - script.execute: pulse_activity_led

# ==========================================================
