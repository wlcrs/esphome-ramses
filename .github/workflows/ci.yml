name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  native-tests:
    name: Native C++ Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B tests/build -S tests

      - name: Build Tests
        run: cmake --build tests/build

      - name: Run Tests
        run: ctest --test-dir tests/build --output-on-failure

  esphome-compile:
    name: ESPHome Compilation Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ESPHome
        run: |
          python -m pip install --upgrade pip
          pip install esphome

      - name: Validate ESPHome Config & Compile
        run: |
          esphome compile example-c6.yaml
          esphome compile example-c6-mqtt.yaml
