name: CI

on:
  push:

jobs:
  native-tests:
    name: Native C++ & Corpus Regression Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B tests/build -S tests

      - name: Build Tests
        run: cmake --build tests/build -j4

      - name: Run CTest Suite (11 Test Suites)
        run: ctest --test-dir tests/build --output-on-failure

  parity-harness:
    name: Dual Python & C++ Parity Test Harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Build Native C++ Codecs
        run: |
          cmake -B tests/build -S tests
          cmake --build tests/build -j4

      - name: Run Differential Parity Harness
        run: uv run --with ramses-rf python tests/test_parity_harness.py

      - name: Run Full ramses_rf Regression Corpus
        run: uv run --with ramses-rf python tests/test_parity_corpus.py

      - name: Run Native Semantic Corpus Parity
        run: uv run --with ramses-rf python tests/test_parity_corpus_native.py

  esphome-compile:
    name: ESPHome ESP-IDF Firmware Compilation
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config:
          - esp32-c6-ramses.yaml
          - esp32-c6-ramses-mqtt.yaml
          - esp32-c6-ramses-discovery.yaml
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install ESPHome
        run: |
          python -m pip install --upgrade pip
          pip install esphome

      - name: Compile and Stage Firmware
        run: |
          yaml_file="${{ matrix.config }}"
          name="${yaml_file%.yaml}"
          mkdir -p dist

          esphome compile "${yaml_file}"

          factory_bin=$(find .esphome/build -name "firmware.factory.bin" -type f | head -n 1)
          ota_bin=$(find .esphome/build -name "firmware.ota.bin" -type f | head -n 1)

          if [ -n "$factory_bin" ] && [ -f "$factory_bin" ]; then
            cp "$factory_bin" "dist/${name}.factory.bin"
            echo "Staged: dist/${name}.factory.bin"
          fi
          if [ -n "$ota_bin" ] && [ -f "$ota_bin" ]; then
            cp "$ota_bin" "dist/${name}.ota.bin"
            echo "Staged: dist/${name}.ota.bin"
          fi

          ls -la dist/

      - name: Upload Single Config Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.config }}
          path: dist/*
          retention-days: 14
          if-no-files-found: error

  release:
    needs: esphome-compile
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: firmware-*
          path: dist
          merge-multiple: true

      - name: Release Firmware Binaries
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
