repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff check
        entry: uvx ruff check
        language: system
        types: [python]
        files: ^(components|tests)/.+\.py$

      - id: ruff-format
        name: Ruff format
        entry: uvx ruff format --check
        language: system
        types: [python]
        files: ^(components|tests)/.+\.py$

      - id: no-legacy-typing-imports
        name: no legacy typing imports
        entry: 'from typing import.*\b(List|Dict|Set|Tuple|Optional|Union)\b'
        language: pygrep
        types: [python]
        files: ^(components|tests)/.+\.py$

      - id: clang-format
        name: clang-format
        entry: uvx clang-format --dry-run -Werror
        language: system
        types_or: [c++, c]
        files: ^(components|tests)/.+\.(cpp|h)$

      - id: ctest
        name: Run native unit tests
        entry: bash -c 'cmake -B build -S tests && cmake --build build && ctest --test-dir build --output-on-failure'
        language: system
        pass_filenames: false
        files: ^(components|tests)/.+\.(cpp|h|cmake|txt)$
