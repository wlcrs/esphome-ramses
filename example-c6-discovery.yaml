# ==============================================================================
# Target Hardware: Elecram ESP32-C6 WiFi/Zigbee to 855–925 MHz Wireless Interface Board (Auto-Discovery Mode)
# Product Page: https://elecram.com/products/esp32-c6-wifi-zigbee-to-855-925mhz-wireless
# Repository: https://github.com/Elecram/ramses_esp
# Pinout: CS=GPIO18, SCK=GPIO6, MOSI=GPIO7, MISO=GPIO2, GDO0=GPIO15, GDO2=GPIO14, LED=GPIO19
# Live Web Discovery Table: http://<esp-ip>/ramses
# ==============================================================================


substitutions:
  name: "esphome-ramses-discovery"
  friendly_name: "RAMSES ESP Discovery Engine"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-c6-devkitc-1
  variant: esp32c6
  framework:
    type: esp-idf


external_components:
  - source: components
    components: [ ramses_esp, ramses_devices, ramses_discovery ]

api:

# Enable Improv Wi-Fi over Web Serial (for web.esphome.io)
improv_serial:

# Enable Wi-Fi & Web Server to access the Discovery Dashboard in browser at http://<esp-ip>/ramses
wifi:
  ap:
    ssid: "ESPHome-RAMSES-AP"

captive_portal:

# Embedded Web Server (enables live web discovery table at http://<esp-ip>/ramses)
web_server:
  port: 80


logger:
  level: DEBUG

# Elecram / IMMRMKW ESP32-C6 Board Activity LED on GPIO19
output:
  - platform: gpio
    pin: GPIO19
    id: led_output

light:
  - platform: binary
    name: "Activity LED"
    output: led_output
    id: activity_led
    restore_mode: ALWAYS_OFF
    internal: true


script:
  - id: pulse_activity_led
    mode: restart
    then:
      - light.turn_on: activity_led
      - delay: 40ms
      - light.turn_off: activity_led

# RAMSES II Physical / MAC Transceiver (Elecram ESP32-C6 Pinout)
ramses_esp:
  id: ramses_hub
  sck_pin: GPIO6
  miso_pin: GPIO2
  mosi_pin: GPIO7
  cs_pin: GPIO18
  gdo0_pin: GPIO15 # CC1101 GDO0 (TX)
  gdo2_pin: GPIO14 # CC1101 GDO2 (Demodulated RX Data)
  port: 6638
  on_message:
    - script.execute: pulse_activity_led

ramses_discovery:
  ramses_esp_id: ramses_hub
  active_probing: true
  probing_interval: 30s


