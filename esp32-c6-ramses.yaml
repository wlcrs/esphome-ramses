# ==============================================================================
# Target Hardware: Elecram ESP32-C6 WiFi/Zigbee to 855–925 MHz Wireless Interface Board
# Product Page: https://elecram.com/products/esp32-c6-wifi-zigbee-to-855-925mhz-wireless
# Repository: https://github.com/Elecram/ramses_esp
# Pinout: CS=GPIO18, SCK=GPIO6, MOSI=GPIO7, MISO=GPIO2, GDO0=GPIO15, GDO2=GPIO14, LED=GPIO19
# ==============================================================================


substitutions:
  name: "esphome-ramses"
  friendly_name: "ESPHome RAMSES Gateway"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-c6-devkitc-1
  variant: esp32c6
  framework:
    type: esp-idf

external_components:
  - source: components
    components: [ ramses_esp ]

# Enable Home Assistant API & Web Server / Logging / OTA
api:

ota:
  - platform: esphome
  - platform: web_server

logger:
  level: DEBUG

# Enable Improv Wi-Fi over Web Serial (for web.esphome.io)
improv_serial:

# Enable Wi-Fi & Web Server to access the Discovery Dashboard in browser at http://<esp-ip>/ramses
wifi:
  ap:
    ssid: "ESPHome-RAMSES-AP"

captive_portal:

# ==============================================================================
# Activity LED on GPIO19 (Flashes on RF packet RX/TX)
# ==============================================================================
output:
  - platform: gpio
    pin: GPIO19
    id: led_output

light:
  - platform: binary
    name: "Activity LED"
    output: led_output
    id: activity_led
    restore_mode: ALWAYS_OFF

# Fast 40ms pulse script triggered on RF packet events
script:
  - id: pulse_activity_led
    mode: restart
    then:
      - light.turn_on: activity_led
      - delay: 40ms
      - light.turn_off: activity_led

# RAMSES II Transceiver & HGI80 TCP Gateway (Port 6638)
ramses_esp:
  id: ramses_hub
  cs_pin: GPIO18
  sck_pin: GPIO6
  mosi_pin: GPIO7
  miso_pin: GPIO2
  gdo0_pin: GPIO15 # CC1101 GDO0 (TX)
  gdo2_pin: GPIO14 # CC1101 GDO2 (Demodulated RX Data)
  uart_num: 1      # ESP32 hardware UART peripheral (default: 1)
  port: 6638       # TCP port for Home Assistant ramses_rf / ramses_cc (socket://<ip>:6638)
  on_message:
    - lambda: |-
        ESP_LOGD("ramses", "HGI80: %s", x.c_str());
    # Flash the activity LED on incoming RAMSES frame
    - script.execute: pulse_activity_led


